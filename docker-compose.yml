services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: ux-republic-landing
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
